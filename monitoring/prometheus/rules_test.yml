# Unit tests for rules.yml (promtool test rules). Run:
#   docker run --rm --entrypoint promtool -v $PWD/monitoring/prometheus:/p -w /p \
#     prom/prometheus:v3.15.0 test rules rules_test.yml
rule_files:
  - rules.yml

evaluation_interval: 1m

tests:
  # 2 uploads a minute with mean intensity 155, training baseline 119.5 +- 11.9
  - name: brighter uploads fire InputDrift
    interval: 1m
    input_series:
      - series: malariascope_input_mean_intensity_sum
        values: "0+310x20"
      - series: malariascope_input_mean_intensity_count
        values: "0+2x20"
      - series: 'malariascope_pipeline_train_intensity_mean{stage="preprocess"}'
        values: "119.5x20"
      - series: 'malariascope_pipeline_train_intensity_std{stage="preprocess"}'
        values: "11.9x20"
    alert_rule_test:
      - eval_time: 18m
        alertname: InputDrift
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Uploads look different from the training data (mean intensity 35.5 away from training)"

  - name: uploads like the training data do not fire InputDrift
    interval: 1m
    input_series:
      - series: malariascope_input_mean_intensity_sum
        values: "0+240x20"
      - series: malariascope_input_mean_intensity_count
        values: "0+2x20"
      - series: 'malariascope_pipeline_train_intensity_mean{stage="preprocess"}'
        values: "119.5x20"
      - series: 'malariascope_pipeline_train_intensity_std{stage="preprocess"}'
        values: "11.9x20"
    alert_rule_test:
      - eval_time: 18m
        alertname: InputDrift
        exp_alerts: []

  - name: too few uploads do not fire InputDrift
    interval: 1m
    input_series:
      - series: malariascope_input_mean_intensity_sum
        values: "0+155x20"
      - series: malariascope_input_mean_intensity_count
        values: "0+1x20"
      - series: 'malariascope_pipeline_train_intensity_mean{stage="preprocess"}'
        values: "119.5x20"
      - series: 'malariascope_pipeline_train_intensity_std{stage="preprocess"}'
        values: "11.9x20"
    alert_rule_test:
      - eval_time: 10m
        alertname: InputDrift
        exp_alerts: []

  - name: model server down for 30 s fires ModelServerDown
    interval: 15s
    input_series:
      - series: malariascope_model_server_up
        values: "1 1 0x10"
    alert_rule_test:
      # rules run every minute: pending at 1m, firing at 2m (down since 30s)
      - eval_time: 1m
        alertname: ModelServerDown
        exp_alerts: []
      - eval_time: 2m
        alertname: ModelServerDown
        exp_alerts:
          - exp_labels:
              severity: critical
              component: serving
            exp_annotations:
              summary: "MLflow model server does not answer /ping; predictions fail"

  - name: a failed DAG run fires PipelineRunFailed
    interval: 1m
    input_series:
      - series: 'malariascope_dag_run_success{job="malariascope_airflow",dag_id="training_pipeline"}'
        values: "1 1 0"
      - series: 'malariascope_dag_run_success{job="malariascope_airflow",dag_id="feedback_retrain"}'
        values: "1 1 1"
    alert_rule_test:
      - eval_time: 1m
        alertname: PipelineRunFailed
        exp_alerts: []
      - eval_time: 2m
        alertname: PipelineRunFailed
        exp_alerts:
          - exp_labels:
              severity: warning
              job: malariascope_airflow
              dag_id: training_pipeline
            exp_annotations:
              summary: "Latest run of Airflow DAG training_pipeline failed"

  - name: low agreement on enough feedback fires FeedbackAccuracyLow
    interval: 1m
    input_series:
      - series: 'malariascope_feedback_total{agreed="true",correct_label="parasitized"}'
        values: "0+1x30"
      - series: 'malariascope_feedback_total{agreed="false",correct_label="parasitized"}'
        values: "0+1x30"
    alert_rule_test:
      - eval_time: 20m
        alertname: FeedbackAccuracyLow
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: "Only 50% of last hour's feedback agreed with the model"
