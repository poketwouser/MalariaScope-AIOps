# mamba env create -f environment.yml
# pin with: pip freeze > requirements.txt
# python 3.10 to match the python:3.10-slim images. airflow runs in its own container.
name: malariascope
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      # data and model
      - tensorflow
      - tensorflow-datasets
      - numpy
      - pandas
      - pillow
      - scikit-learn
      - matplotlib
      - pyyaml
      # data engineering
      - ray[data,default]
      # versioning and tracking
      - dvc
      - mlflow
      # serving and UI
      - fastapi
      - uvicorn[standard]
      - python-multipart
      - streamlit
      - requests
      # monitoring
      - prometheus-client
      # tests and style
      - pytest
      - pytest-cov
      - httpx                 # required by FastAPI's TestClient
      - black
      - flake8
