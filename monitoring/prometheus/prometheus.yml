# Prometheus scrape config (Lecture 9; structure follows DA3408 Monitoring/sample_prometheus.yml).
# Targets are compose service names on the internal network. Alert rules arrive on Day 9.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "backend"
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: "node"
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
