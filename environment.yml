# Conda/Mamba environment for local development (DA3408 Mod1 lab: Git + Conda/Mamba reproducible environment).
# Create:  mamba env create -f environment.yml
# Pin:     pip freeze > requirements.txt
# Python 3.10 matches the course Docker base image (python:3.10-slim, Mod3).
# Airflow is not installed here; it runs in its own container (as in the reference repo's Dockerfile.airflow).
name: malariascope
channels:
  - conda-forge
dependencies:
  - python=3.10
  - pip
  - pip:
      # data and model
      - tensorflow
      - tensorflow-datasets
      - numpy
      - pandas
      - pillow
      - scikit-learn
      - matplotlib
      - pyyaml
      # data engineering (Lecture 8: Ray)
      - ray[data,default]
      # versioning and tracking (Lecture 2 and 11: DVC; Lecture 3 and 10: MLflow)
      - dvc
      - mlflow
      # serving and UI (Lecture 10: REST API serving; reference repo backend and frontend)
      - fastapi
      - uvicorn[standard]
      - python-multipart
      - streamlit
      - requests
      # monitoring (Lecture 9: prometheus_client)
      - prometheus-client
      # testing and code style (rubric: unit tests and standard Python style; tools chosen by the project)
      - pytest
      - pytest-cov
      - httpx                 # required by FastAPI's TestClient
      - black
      - flake8
